name: Deploy MurtiHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================="
            echo "       MURTIHUB DEPLOYMENT STARTING"
            echo "========================================="

            cd /opt/murtihub/app

            echo "Checking project directory..."
            test -f package.json
            test -f server/index.js

            echo "Pulling latest code..."
            git fetch origin main
            git checkout main
            git pull origin main

            echo "Installing dependencies (frontend & backend)..."
            npm ci

            echo "Building frontend..."
            npm run build

            if [ -f server/package.json ]; then
              echo "Installing server-specific dependencies..."
              (cd server && npm ci --omit=dev)
            fi

            echo "Restarting MurtiHub backend on port 5003..."
            cd /opt/murtihub/app
            PORT=5003 pm2 restart murtihub-api --update-env || PORT=5003 pm2 start server/index.js --name murtihub-api --update-env

            echo "Waiting for backend startup..."
            sleep 3

            echo "Checking backend port..."
            if ! ss -ltn | grep -q ':5003 '; then
              echo "ERROR: Backend is not listening on port 5003"
              pm2 logs murtihub-api --lines 40 --nostream
              exit 1
            fi

            echo "Testing Nginx configuration..."
            sudo nginx -t

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Saving PM2 process list..."
            pm2 save

            echo "========================================="
            echo "       MURTIHUB DEPLOYMENT SUCCESS"
            echo "========================================="
