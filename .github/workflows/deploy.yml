name: Deploy MurtiHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================="
            echo "       MURTIHUB DEPLOYMENT STARTING"
            echo "========================================="

            cd /opt/murtihub/app

            echo "Checking project directory..."
            test -f package.json
            test -f server/index.js

            echo "Safely protecting production .env..."
            if [ -f .env ]; then
              cp .env .env.prod.bak
            fi

            echo "Fetching latest code from origin..."
            git fetch origin main

            echo "Discarding local changes to build & dependency artifacts..."
            git checkout -- dist/ 2>/dev/null || true
            git checkout -- node_modules/ 2>/dev/null || true

            echo "Synchronizing to origin/main..."
            git reset --hard origin/main

            if [ -f .env.prod.bak ]; then
              echo "Restoring production .env..."
              cp .env.prod.bak .env
              rm -f .env.prod.bak
            fi

            APP_PORT=$(grep -E "^PORT=" .env | cut -d '=' -f2 | tr -d '\r ' || echo "3000")
            [ -z "$APP_PORT" ] && APP_PORT="3000"

            echo "Installing dependencies (frontend & backend)..."
            npm ci

            echo "Building frontend..."
            npm run build

            if [ -f server/package.json ]; then
              echo "Installing server-specific dependencies..."
              (cd server && npm ci --omit=dev)
            fi

            echo "Restarting MurtiHub backend on port $APP_PORT..."
            cd /opt/murtihub/app
            PORT=$APP_PORT pm2 restart murtihub-api --update-env || PORT=$APP_PORT pm2 start server/index.js --name murtihub-api --update-env

            echo "Waiting for backend startup..."
            sleep 3

            echo "Checking backend port..."
            if ! ss -ltn | grep -q ":$APP_PORT "; then
              echo "ERROR: Backend is not listening on port $APP_PORT"
              pm2 logs murtihub-api --lines 40 --nostream
              exit 1
            fi

            echo "Testing Nginx configuration..."
            sudo nginx -t

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Saving PM2 process list..."
            pm2 save

            echo "========================================="
            echo "       MURTIHUB DEPLOYMENT SUCCESS"
            echo "========================================="
