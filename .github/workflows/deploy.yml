name: Deploy MurtiHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================="
            echo "       MURTIHUB DEPLOYMENT STARTING"
            echo "========================================="

            cd /opt/murtihub-new

            echo "Pulling latest code..."
            git reset --hard
            git clean -fd
            git pull origin main

            echo "Installing frontend dependencies..."
            npm ci

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            cd server
            npm ci

            echo "Restarting MurtiHub backend..."
            pm2 restart murtihub-api

            echo "Saving PM2 process list..."
            pm2 save

            echo "========================================="
            echo "       MURTIHUB DEPLOYMENT SUCCESS"
            echo "========================================="